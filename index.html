const data=raw.split('\n').map(s=>{let [place,r]=s.split('|');return {place,roles:r.split(',')}});const app=document.querySelector('#app');let n=7,a=1,mode='hard',minutes=8,names=[],used=[],round=[],place='',idx=0,starter=0,deadline=0,remaining=0,paused=false,tick;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=x=>{x=[...x];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};const render=s=>app.innerHTML=s;const btn=(s,f,cl='')=>`<button class="${cl}" onclick="${f}">${s}</button>`;
function home(){clearInterval(tick);render(`<section class="center"><small>SPIELELOBBY</small><h1>Agent Undercover</h1><p>Ein geheimer Ort. Verdeckte Agenten. Wem kannst du vertrauen?</p><p class="muted">38 Orte · 532 Rollen · 3–15 Spieler</p>${btn('Spiel einrichten','setup()')}<details><summary>Spielregeln</summary><p>Alle außer den Agenten kennen denselben Ort. Stellt euch reihum Fragen, ohne den Ort direkt zu nennen. Wer gefragt wurde, fragt als Nächstes eine andere Person. Im schweren Modus antwortet ihr aus Sicht eurer Rolle. Agenten versuchen den Ort zu erraten und unentdeckt zu bleiben. Einigt euch bei Rundenende auf einen Verdacht; deckt danach die Rollen auf. Die Gruppe gewinnt, wenn sie alle Agenten findet, bevor diese den Ort richtig erraten.</p></details></section>`)}
function setup(){clearInterval(tick);render(`<section><h2>Spiel einrichten</h2><label>Spieleranzahl</label><select id="n" onchange="saveNames();n=+this.value;a=Math.min(a,maxAgents());setup()">${Array.from({length:13},(_,i)=>`<option ${n===i+3?'selected':''}>${i+3}</option>`).join('')}</select><label>Agenten</label><select onchange="a=+this.value">${Array.from({length:maxAgents()},(_,i)=>`<option ${a===i+1?'selected':''}>${i+1}</option>`).join('')}</select><label>Schwierigkeit</label><select onchange="mode=this.value"><option value="easy" ${mode==='easy'?'selected':''}>Einfach – nur Ort</option><option value="hard" ${mode==='hard'?'selected':''}>Schwer – Ort und Rolle</option></select><label>Rundenzeit (Minuten)</label><input type="number" min="1" max="60" value="${minutes}" onchange="minutes=Math.max(1,Math.min(60,+this.value||8))"><h2>Spielernamen</h2><div class="names">${Array.from({length:n},(_,i)=>`<input maxlength="30" class="name" aria-label="Spieler ${i+1}" placeholder="Spieler ${i+1}" value="${esc(names[i]||'')}">`).join('')}</div>${btn('Rollen auslosen','saveNames();newRound()')}${btn('Hauptmenü','saveNames();home()','secondary')}</section>`)}
function maxAgents(){return Math.min(3,Math.floor((n-1)/2))}function saveNames(){document.querySelectorAll('.name').forEach((e,i)=>names[i]=e.value.trim())}function name(i){return esc(names[i]||`Spieler ${i+1}`)}
function newRound(){clearInterval(tick);if(used.length===data.length)used=[];let d=shuffle(data.filter(x=>!used.includes(x.place)))[0];place=d.place;used.push(place);let agents=shuffle(Array.from({length:n},(_,i)=>i)).slice(0,a),roles=shuffle(d.roles);round=Array.from({length:n},(_,i)=>agents.includes(i)?null:roles.pop());idx=0;starter=Math.floor(Math.random()*n);handoff()}
function handoff(){render(`<section class="center"><small>SPIELER ${idx+1} VON ${n}</small><progress value="${idx}" max="${n}"></progress><h1>${name(idx)}, du bist dran!</h1><p>Nur du darfst jetzt auf den Bildschirm schauen.</p>${btn('Rolle aufdecken','reveal()')}</section>`)}
function reveal(){let r=round[idx];render(`<section class="center ${r===null?'agent':''}"><small>${name(idx)} · STRENG GEHEIM</small><p>${r===null?'DEIN AUFTRAG':'DEIN GEHEIMER ORT'}</p><div class="big">${r===null?'AGENT':esc(place)}</div>${r===null?'<p>Finde den geheimen Ort heraus. Bleib unentdeckt!</p>':mode==='hard'?`<p>DEINE ROLLE</p><h1>${esc(r)}</h1><p>Antworte aus Sicht deiner Rolle.</p>`:'<p>Beantworte Fragen, ohne den Ort zu verraten.</p>'}${btn('Rolle verdecken','hideRole()')}</section>`)}
function hideRole(){render(`<section class="center"><h1>🔒 Rolle verdeckt</h1><p>${idx+1<n?`Gib das Tablet an <b>${name(idx+1)}</b> weiter.`:'Alle kennen ihre Rolle. Bereit?'}</p>${btn(idx+1<n?'An den nächsten Spieler weitergeben':'Spiel starten',idx+1<n?'idx++;handoff()':'start()')}</section>`)}
function start(){remaining=minutes*60000;paused=false;deadline=Date.now()+remaining;render(`<section class="center"><small>MISSION LÄUFT</small><div id="clock" class="timer"></div><p><b>${name(starter)}</b> stellt die erste Frage.</p><div class="row">${btn('Pause','togglePause()','secondary')}${btn('Runde beenden','finish()','secondary')}</div></section><section><h2>Mögliche Orte</h2><div class="grid">${data.map(d=>`<div class="chip">${esc(d.place)}</div>`).join('')}</div></section>`);update();tick=setInterval(update,200)}
function update(){if(!paused)remaining=Math.max(0,deadline-Date.now());let s=Math.ceil(remaining/1000),c=document.querySelector('#clock');if(c)c.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;if(!remaining){clearInterval(tick);finish()}}
function togglePause(){if(!paused){remaining=Math.max(0,deadline-Date.now());paused=true}else{deadline=Date.now()+remaining;paused=false}let b=document.querySelector('button[onclick="togglePause()"]');if(b)b.textContent=paused?'Fortsetzen':'Pause';update()}
function finish(){clearInterval(tick);render(`<section class="center"><h1>Wer ist Agent?</h1><p>Diskutiert euren Verdacht. Die Agenten können ihren Tipp zum Ort abgeben. Deckt erst danach die Lösung auf.</p>${btn('Auflösung anzeigen','solution()')}</section>`)}
function solution(){render(`<section><small>MISSION BEENDET</small><h1>${esc(place)}</h1>${round.map((r,i)=>`<p>${name(i)} — <b style="color:${r===null?'#ffb1b1':'#e6c47b'}">${r===null?'AGENT':mode==='hard'?esc(r):'Ortskundiger'}</b></p>`).join('')}${btn('Neue Runde','newRound()')}${btn('Einstellungen ändern','setup()','secondary')}${btn('Hauptmenü','home()','secondary')}</section>`)}home();</script></html>
